openapi: 3.1.0
info:
  description: The Riipen API uses [REST](https://en.wikipedia.org/wiki/Representational_state_transfer) and RESTful principles. Our URLs are predictable and resource-oriented. Riipen accepts [JSON](https://en.wikipedia.org/wiki/JSON) encoded request bodies and returns JSON encoded responses and uses standard HTTP codes and verbs.
  title: Riipen API
  termsOfService: http://riipen.com/terms
  version: 1.0.0
servers:
  - url: http://app.riipen.com/api/v1
paths:
  /companies:
    get:
      summary: List companies
      description: List companies.
      operationId: companyList
      tags:
        - Companies
      parameters:
        - in: query
          name: name
          description: Filters companies by name "eq" (case insensitive).
          schema:
            type: object
            properties:
              eq:
                type: string
        - in: query
          name: sort
          schema:
            type: string
            enum:
              - created_at
              - updated_at
      responses:
        "200":
          description: Response to a valid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CompanyIncludes"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /companies/{id}:
    get:
      summary: Get a company
      description: Get a company by ID.
      operationId: companyGet
      tags:
        - Companies
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the company to retrieve
          schema:
            type: string
      responses:
        "200":
          description: Response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyIncludes"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /experiences:
    get:
      summary: List experiences
      description: List experiences.
      operationId: experienceList
      tags:
        - Experiences
      parameters:
        - in: query
          name: in_marketplace
          description: Filters experiences by whether experience is in marketplace.
          schema:
            type: object
            properties:
              eq:
                type: boolean
        - in: query
          name: name
          description: Filters experiences by name "eq" (case insensitive).
          schema:
            type: object
            properties:
              eq:
                type: string
        - in: query
          name: portal_id
          description: Filters experiences by portal.
          schema:
            type: object
            properties:
              eq:
                type: string
        - in: query
          name: state
          description: Filters experiences by state, only usable when portal_id=YOUR_PORTAL_ID.
          schema:
            type: object
            properties:
              eq:
                type: string
                enum:
                  - draft
                  - published
        - in: query
          name: sort
          schema:
            type: string
            enum:
              - created_at
              - updated_at
      responses:
        "200":
          description: Response to a valid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExperienceIncludes"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create an experience
      description: Create an experience.
      operationId: experienceCreate
      tags:
        - Experiences
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Experience"
      responses:
        "201":
          description: Response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperienceIncludes"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /experiences/{id}:
    get:
      summary: Get an experience
      description: Get an experience by ID.
      operationId: experienceGet
      tags:
        - Experiences
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the experience to retrieve
          schema:
            type: string
      responses:
        "200":
          description: Response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperienceIncludes"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Update an experience
      description: Update an experience by ID.
      operationId: experienceUpdate
      tags:
        - Experiences
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the experience to update
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Experience"
      responses:
        "200":
          description: Response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperienceIncludes"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete an experience
      description: Delete an experience by ID.
      operationId: experienceDelete
      tags:
        - Experiences
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the experience to delete.
          schema:
            type: string
      responses:
        "200":
          description: Response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deleted"
              example:
                id: 123ABC
                object: Experience
                deleted: true
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /experiences/{id}/publish:
    post:
      summary: Publish an experience
      description: Publish an experience by ID.
      operationId: experiencePublish
      tags:
        - Experiences
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the experience to publish
          schema:
            type: string
      responses:
        "200":
          description: Response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperienceIncludes"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /feedbacks/{id}:
    get:
      summary: Get a feedback
      description: Get a feedback by ID.
      operationId: feedbackGet
      tags:
        - Feedback
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the feedback to retrieve
          schema:
            type: string
      responses:
        "200":
          description: Response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackIncludes"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /invites:
    get:
      summary: List invites
      description: List invites.
      operationId: inviteList
      tags:
        - Invites
      parameters:
        - in: query
          name: inviteable_id
          description: Filters invites by their inviteable id (for a company this would be the company's id).
          schema:
            type: object
            properties:
              eq:
                type: string
        - in: query
          name: inviteable_type
          description: Filters invites by inviteable type.
          schema:
            type: object
            properties:
              eq:
                type: string
        - in: query
          name: state
          description: Filters invites by state.
          schema:
            type: object
            properties:
              eq:
                type: string
                enum:
                  - accepted
                  - pending
        - in: query
          name: sort
          schema:
            type: string
            enum:
              - created_at
              - email
      responses:
        "200":
          description: Response to a valid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invite"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create an invite
      description: Create an invite.
      operationId: inviteCreate
      tags:
        - Invites
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Invite"
      responses:
        "201":
          description: Response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteIncludes"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /invites/{id}:
    get:
      summary: Get an invite
      description: Get an invite by ID.
      operationId: inviteGet
      tags:
        - Invites
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the invite to retrieve
          schema:
            type: string
      responses:
        "200":
          description: Response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteIncludes"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /matches/{id}:
    get:
      summary: Get a match
      description: Get a match by ID.
      operationId: matchGet
      tags:
        - Matches
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the match to retrieve
          schema:
            type: string
      responses:
        "200":
          description: Response to a valid request
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Match"
                example:
                  applications_due_at: "2017-09-28T22:39:11-06:00"
                  created_at: "2017-09-28T22:39:11-06:00"
                  end_date: "2020-05-22T12:13:11-06:00"
                  experience_id: 8mepY2aX
                  id: 8mepY2aX
                  learners_maximum: 5
                  match_request_id: 8mepY2aX
                  object: Match
                  project_id: 8mepY2aX
                  question_set_id: 8mepY2aX
                  start_date: "2020-05-22T12:13:11-06:00"
                  teams_maximum: 4
                  updated_at: "2020-05-22T12:13:11-06:00"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /match_requests/{id}:
    get:
      summary: Get a match request
      description: Get a match request by ID.
      operationId: matchRequestGet
      tags:
        - Match Requests
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the match request to retrieve
          schema:
            type: string
      responses:
        "200":
          description: Response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchRequestIncludes"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /match_requests/{id}/experience_accept:
    post:
      summary: Accept a match request for the experience
      description: Accept a match request for the experience by ID.
      operationId: matchRequestExperienceAccept
      tags:
        - Match Requests
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the match request.
          schema:
            type: string
      responses:
        "200":
          description: Response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchRequestIncludes"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /match_requests/{id}/decline:
    post:
      summary: Decline a match request
      description: Decline a match request by ID.
      operationId: matchRequestDecline
      tags:
        - Match Requests
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the match request.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                decline_reason:
                  type: string
                  description: The reason for declining the match request.
                  enum:
                    - company_attributes
                    - company_matches_maximum
                    - experience_company_matches_maximum
                    - experience_scope
                    - full
                    - learner_level
                    - project_matches_maximum
                    - project_scope
                    - other
                recipient_notes:
                  type: string
                  description: Additional notes why the match request was declined.
      responses:
        "200":
          description: Response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchRequestIncludes"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /match_requests/{id}/project_accept:
    post:
      summary: Accept a match request for the project
      description: Accept a match request for the project by ID.
      operationId: matchRequestProjectAccept
      tags:
        - Match Requests
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the match request.
          schema:
            type: string
      responses:
        "200":
          description: Response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchRequestIncludes"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /members:
    get:
      summary: List members
      description: List members.
      operationId: memberList
      tags:
        - Members
      parameters:
        - in: query
          name: memberable_id
          description: Filters members by their entity id (for a project this would be the project's id).
          required: true
          schema:
            type: object
            properties:
              eq:
                type: string
        - in: query
          name: memberable_type
          description: Filters members by object type.
          required: true
          schema:
            type: object
            properties:
              eq:
                type: string
        - in: query
          name: user_id
          description: Filters members by user_id.
          schema:
            type: object
            properties:
              eq:
                type: string
        - in: query
          name: sort
          schema:
            type: string
            enum:
              - created_at
              - updated_at
      responses:
        "200":
          description: Response to a valid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MemberIncludes"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /portals:
    get:
      summary: List portals
      description: List portals.
      operationId: portalList
      tags:
        - Portals
      parameters:
        - in: query
          name: name
          description: Filters portals by name "eq" (case insensitive).
          schema:
            type: object
            properties:
              eq:
                type: string
        - in: query
          name: sort
          schema:
            type: string
            enum:
              - created_at
              - updated_at
      responses:
        "200":
          description: Response to a valid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PortalIncludes"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /portals/{id}:
    get:
      summary: Get a portal
      description: Get a portal by ID.
      operationId: portalGet
      tags:
        - Portals
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the portal to retrieve
          schema:
            type: string
      responses:
        "200":
          description: Response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalIncludes"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /portal_passes:
    get:
      summary: List portal passes
      description: List portal passes.
      operationId: portalPassList
      tags:
        - Portal Passes
      parameters:
        - in: query
          name: company_id
          description: Filters portal passes by company.
          schema:
            type: object
            properties:
              eq:
                type: string
        - in: query
          name: portal_id
          description: Filters portal passes by portal.
          schema:
            type: object
            properties:
              eq:
                type: string
        - in: query
          name: sort
          schema:
            type: string
            enum:
              - created_at
      responses:
        "200":
          description: Response to a valid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PortalPassIncludes"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /portal_passes/{id}:
    get:
      summary: Get a portal pass
      description: Get a portal pass by ID.
      operationId: portalPassGet
      tags:
        - Portal Passes
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the portal pass to retrieve
          schema:
            type: string
      responses:
        "200":
          description: Response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalPassIncludes"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /portal_pass_invites:
    get:
      summary: List portal pass invites
      description: List portal pass invites.
      operationId: portalPassInviteList
      tags:
        - Portal Pass Invites
      parameters:
        - in: query
          name: portal_id
          description: Filters portal pass invites by their portal id.
          schema:
            type: object
            properties:
              eq:
                type: string
        - in: query
          name: state
          description: Filters portal pass invites by state.
          schema:
            type: object
            properties:
              eq:
                type: string
        - in: query
          name: sort
          schema:
            type: string
            enum:
              - created_at
              - updated_at
      responses:
        "200":
          description: Response to a valid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PortalPassInviteIncludes"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a portal pass invite
      description: Create a portal pass invite.
      operationId: portalPassInviteCreate
      tags:
        - Portal Pass Invites
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalPassInvite"
      responses:
        "201":
          description: Response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalPassInviteIncludes"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /portal_pass_invites/{id}:
    get:
      summary: Get a portal pass invite
      description: Get a portal pass invite by ID.
      operationId: portalPassInviteGet
      tags:
        - Portal Pass Invites
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the portal pass invite to retrieve
          schema:
            type: string
      responses:
        "200":
          description: Response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalPassInviteIncludes"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects:
    get:
      summary: List projects
      description: List projects.
      operationId: projectList
      tags:
        - Projects
      parameters:
        - in: query
          name: company_id
          description: Filters projects by company.
          schema:
            type: object
            properties:
              eq:
                type: string
        - in: query
          name: state
          description: Filters projects by state.
          schema:
            type: object
            properties:
              eq:
                type: string
                enum:
                  - draft
                  - published
        - in: query
          name: sort
          schema:
            type: string
            enum:
              - created_at
              - updated_at
      responses:
        "200":
          description: Response to a valid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectIncludes"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a project
      description: Create a project.
      operationId: projectCreate
      tags:
        - Projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Project"
      responses:
        "201":
          description: Response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectIncludes"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{id}:
    get:
      summary: Get a project
      description: Get a project by ID.
      operationId: projectGet
      tags:
        - Projects
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the project to retrieve
          schema:
            type: string
      responses:
        "200":
          description: Response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectIncludes"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Update a project
      description: Update a project by ID.
      operationId: projectUpdate
      tags:
        - Projects
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the project to update
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Project"
      responses:
        "200":
          description: Response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectIncludes"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a project
      description: Delete a project by ID.
      operationId: projectDelete
      tags:
        - Projects
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the project to delete.
          schema:
            type: string
      responses:
        "200":
          description: Response to a valid request
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Deleted"
                  - type: object
                    properties:
                      object:
                        type: string
                        example: Project
                        description: The resource type which was deleted.
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{id}/publish:
    post:
      summary: Publish a project
      description: Publish a project by ID.
      operationId: projectPublish
      tags:
        - Projects
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the project to publish
          schema:
            type: string
      responses:
        "200":
          description: Response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectIncludes"
        default:
          description: Error
          content:
