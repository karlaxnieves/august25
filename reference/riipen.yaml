    post:
      operationId: webhook-experience-created
      summary: Experience created
      description: Webhook for the `experience.created` event. For more info see [Getting Started](https://docs.riipen.com/update/docs/getting-started-webhooks).
      tags:
        - Experience events
      parameters:
        - name: X-Riipen-Signature
          in: header
          description: An HMAC that you should use to check that requests are authentic. Compare this value with your own digest, computed from the request body and your webhook secret. For more info see [Signatures](https://docs.riipen.com/update/docs/signatures).
          schema:
            type: string
            examples:
              - t=1709686052,v1=n3ulUDfqGSkzarlvyeg2oZe3qx3sQjbSno5s7Icx4dy8CbTPqu8xvQ5ZyEJy
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: string
      responses:
        "200":
          description: Response to a valid request
components:
  parameters:
    Limit:
      name: limit
