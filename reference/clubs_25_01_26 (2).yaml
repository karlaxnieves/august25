openapi: 3.0.0
info:
  version: 1.0.0.0
  title: Clubs API
tags:
  - name: not clubssssss
servers:
  - url: https://api.staging.antavo.com
    description: The Antavo staging environment
paths:
  /v1/clubs/templates:
    get:
      tags:
        - Clubs
      summary: List club templates
      description: >-
        This endpoint returns the list of club templates based on various query
        parameters.
      parameters:
        - name: id.eq
          in: query
          description: Filter to a specific template by ID.
          required: false
          schema:
            type: string
          example: 123e4567-e89b-12d3-a456-426614174000
        - name: name
          in: query
          description: Filter templates by name.
          required: false
          schema:
            type: string
          example: Families and Friends
        - name: type
          in: query
          description: Filter templates by type.
          required: false
          schema:
            type: string
            enum:
              - public
              - private
          example: public
        - name: status
          in: query
          description: Filter templates by status.
          required: false
          schema:
            type: string
            enum:
              - active
              - draft
              - archived
          example: active
        - name: offset
          in: query
          description: >-
            Offsets the starting number of club templates to return. This is
            used in pagination in conjunction with the limit query.
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
          example: 10
        - name: limit
          in: query
          description: >-
            Limits the number of club templates returned in one response. Other
            values are accessible by pagination made accessible via the offset.
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          example: 50
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTemplatesSuccessResponse'
        '400':
          description: Bad request due to invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTemplatesBadRequestResponse'
  /v1/clubs:
    get:
      tags:
        - Clubs
      summary: List club templates
      description: >-
        This endpoint returns the list of clubs based on various query
        parameters.
      parameters:
        - name: id.eq
          in: query
          required: false
          description: Filter to a specific club by ID.
          schema:
            type: string
          example: 987e6543-e89b-12d3-a456-426614174000
        - name: template_id
          in: query
          required: false
          description: Filter by associated template ID.
          schema:
            type: string
          example: 123e4567-e89b-12d3-a456-426614174000
        - name: name
          in: query
          required: false
          description: Filter by name.
          schema:
            type: string
          example: Family Moments Club
        - name: type
          in: query
          required: false
          description: Filter by template type.
          schema:
            type: string
            enum:
              - public
              - private
            example: public
        - name: status
          in: query
          required: false
          description: Filter by status.
          schema:
            type: string
            enum:
              - active
              - disbanded
              - fraudulent
            example: active
        - name: offset
          in: query
          required: false
          description: >-
            Offsets the starting number of clubs to return. This is used in
            pagination in conjunction with the limit query.
          schema:
            type: integer
            default: 0
          example: 10
        - name: limit
          in: query
          required: false
          description: >-
            Limits the number of clubs returned in one response. Other values
            are accessible by pagination made accessible via the offset.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          example: 50
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListClubsSuccessResponse'
        '204':
          description: Request successful but no clubs found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListClubsEmptySuccessResponse'
        '400':
          description: Bad request due to invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListClubsBadRequestResponse'
    post:
      tags:
        - Clubs
      summary: Create a new club
      description: >-
        This endpoint allows users to create a new club. Clubs can be assigned
        under different templates, allowing for varied functionalities and
        features tailored to specific user needs. When creating a club, the user
        must provide essential information, including the club's name,
        associated template, and the owner's ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: object
                  description: >-
                    The name of the club, which can be provided in multiple
                    languages. This parameter should be an object where each key
                    corresponds to a language code, and the value is the club
                    name in that language. At least one language must be
                    provided.
                  properties:
                    en:
                      type: string
                      example: Family Moments Club
                template_id:
                  type: string
                  description: >-
                    The unique identifier of the club template under which the
                    new club is being created. This ID must reference an
                    existing template in the system and should be active. If the
                    specified template does not exist or is inactive, an error
                    will be returned.
                  example: 123e4567-e89b-12d3-a456-426614174000
                owner_id:
                  type: string
                  description: >-
                    The unique identifier of the customer who will own the new
                    club. The customer associated with this ID must be active
                    and should not already own another club or be a member of
                    another club.
                  example: 62cc313988befe60e3413e75
      responses:
        '200':
          description: Club created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateClubSuccessResponse'
        '400':
          description: Bad request due to invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateClubBadRequestResponse'
  /v1/clubs/{club_id}:
    get:
      tags:
        - Clubs
      summary: Retrieve club details
      description: This endpoint returns details of a specific club.
      parameters:
        - name: club_id
          in: path
          required: true
          description: >-
            The unique identifier of the club whose details are being requested.
            This ID must correspond to an existing club.
          schema:
            type: string
            example: 66056b8fc0380d23824277b7
      responses:
        '200':
          description: Successful response with club details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubDetailsSuccessResponse'
        '404':
          description: Club not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubDetailsNotFoundResponse'
  /v1/clubs/{club_id}/members:
    get:
      tags:
        - Clubs
      summary: List members of a specific club
      description: >-
        This endpoint returns the registered club members of a specified club.
        You can filter members by various parameters, such as member ID, role,
        and status. Pagination is also supported through offset and limit query
        parameters.
      parameters:
        - name: club_id
          in: path
          required: true
          description: The unique identifier of the club whose members are being requested.
          schema:
            type: string
            example: 65fc09f6cab4445deb626562
        - name: id.eq
          in: query
          required: false
          description: Filter to a specific club member by their unique identifier.
          schema:
            type: string
            example: 6604074cb8208607742492c7
        - name: role
          in: query
          required: false
          description: Filter by member type. Possible values are 'owner' or 'member'.
          schema:
            type: string
            enum:
              - owner
              - member
            example: member
        - name: status
          in: query
          required: false
          description: >-
            Filter by member status. Possible values are 'applicant', 'active',
            'kicked', 'removed', or 'banned'.
          schema:
            type: string
            enum:
              - applicant
              - active
              - kicked
              - removed
              - banned
            example: active
        - name: offset
          in: query
          required: false
          description: >-
            Offsets the starting number of club members to return. This is used
            in pagination in conjunction with the limit query.
          schema:
            type: integer
            default: 0
            example: 0
        - name: limit
          in: query
          required: false
          description: >-
            Limits the number of club templates returned in one response. Other
            values are accessible by pagination made accessible via the offset.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
            example: 20
      responses:
        '200':
          description: Successful response with the list of club members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubMembersSuccessResponse'
        '400':
          description: Bad request due to invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubMembersBadRequestResponse'
  /v1/clubs/{club_id}/members/{customer_id}:
    get:
      tags:
        - Clubs
      summary: Retrieve details of a specific club member
      description: >-
        This endpoint returns detailed information about a specific club member
        identified by their customer ID. The response includes the member's
        role, status, balance, and spending limits within the club.
      parameters:
        - name: club_id
          in: path
          required: true
          description: The unique identifier of the club to which the member belongs.
          schema:
            type: string
            example: 65d758e7f9cb852e19212e15
        - name: customer_id
          in: path
          required: true
          description: >-
            The unique identifier of the club member whose details are being
            requested.
          schema:
            type: string
            example: 62cc313988befe60e3413e75
      responses:
        '200':
          description: Successful response with details of the club member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetailsResponse'
        '404':
          description: Not found response indicating the requested resource does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberNotFoundResponse'
  /v1/clubs/{club_id}/members/{customer_id}/remove:
    post:
      tags:
        - Clubs
      summary: Remove a member from a club
      description: >-
        This endpoint allows users to remove a member from a club. The customer
        may re-apply to join the club later.
      parameters:
        - name: club_id
          in: path
          required: true
          description: >-
            The unique identifier of the club from which the member will be
            removed.
          schema:
            type: string
            example: 66cc313988befe60e3413e75
        - name: customer_id
          in: path
          required: true
          description: The unique identifier of the member to be removed from the club.
          schema:
            type: string
            example: 22cc313988befe60e3413e76
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - actor
              properties:
                actor:
                  type: string
                  description: >-
                    The ID of the customer performing the removal action. This
                    is a mandatory field.
                  example: 33cc313988befe60e3413e76
                reason:
                  type: string
                  description: Reason for removing the member from the club (optional).
                  example: Inactive user
      responses:
        '200':
          description: >-
            Successful response indicating the member has been removed from the
            club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveMemberResponse'
        '400':
          description: Bad request response indicating an issue with the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveMemberBadRequestResponse'
        '404':
          description: Not found response indicating the requested resource does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveMemberNotFoundResponse'
  /v1/clubs/{club_id}/members/{customer_id}/ban:
    post:
      tags:
        - Clubs
      summary: Ban a member from a club
      description: >-
        This endpoint is used to removes a member from a club with a ban,
        preventing the customer from rejoining in the future.
      parameters:
        - name: club_id
          in: path
          required: true
          description: >-
            The unique identifier of the club from which the member will be
            banned.
          schema:
            type: string
            example: 66cc313988befe60e3413e75
        - name: customer_id
          in: path
          required: true
          description: The unique identifier of the member to be banned from the club.
          schema:
            type: string
            example: 22cc313988befe60e3413e76
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - actor
              properties:
                actor:
                  type: string
                  description: >-
                    The ID of the customer performing the ban action. This is a
                    mandatory field.
                  example: 33cc313988befe60e3413e76
                reason:
                  type: string
                  description: Reason for banning the member from the club (optional).
                  example: Fraudulent user
      responses:
        '200':
          description: >-
            Successful response indicating the member has been banned from the
            club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BanMemberResponse'
        '400':
          description: Bad request response indicating an issue with the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BanMemberBadRequestResponse'
        '404':
          description: Not found response indicating the requested resource does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BanMemberNotFoundResponse'
  /v1/clubs/{club_id}/members/{customer_id}/unban:
    post:
      tags:
        - Clubs
      summary: Unban a banned member from a club
      description: This endpoint allows users to unban a banned member from a club.
      parameters:
        - name: club_id
          in: path
          required: true
          description: >-
            The unique identifier of the club from which the member is being
            unbanned.
          schema:
            type: string
            example: 66cc313988befe60e3413e75
        - name: customer_id
          in: path
          required: true
          description: The unique identifier of the customer who is being unbanned.
          schema:
            type: string
            example: 22cc313988befe60e3413e76
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - actor
              properties:
                actor:
                  type: string
                  description: >-
                    The ID of the customer making the unban action (restricted
                    to owner ID).
                  example: 33cc313988befe60e3413e76
                reason:
                  type: string
                  description: Reason for the unban action (optional).
                  example: Wrongly banned member
      responses:
        '200':
          description: Successful response indicating the member has been unbanned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnbanMemberResponse'
        '400':
          description: Bad request response indicating an issue with the requestgh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnbanMemberBadRequestResponse'
        '404':
          description: Not found response indicating the requested resource does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnbanMemberNotFoundResponse'
  /v1/clubs/{club_id}/members/join-public:
    post:
      summary: Add a customer to a public club
      description: >-
        This endpoint adds a registered loyalty member to a public club as an
        active club member.
      parameters:
        - name: club_id
          in: path
          required: true
          description: The unique identifier of the public club to join.
          schema:
            type: string
            example: 66cc313988befe60e3413e75
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
              properties:
                customer_id:
                  type: string
                  description: The loyalty member’s identifier to join.
                  example: 62cc313988befe60e3413e44
                channel:
                  type: string
                  description: Channel through which the member is joining (optional).
                  example: friend referral
      responses:
        '200':
          description: Successful response indicating the member has joined the public club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJoinResponse'
        '400':
          description: >-
            Bad request response indicating an issue with the request for
            joining a public club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJoinBadRequestResponse'
        '404':
          description: Not found response indicating the requested resource does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJoinNotFoundResponse'
  /v1/clubs/invitations/{invitation_id}:
    post:
      summary: Add a customer to a private club
      description: >-
        This endpoint adds a registered loyalty member to a private club as an
        active club member.
      parameters:
        - name: invitation_id
          in: path
          required: true
          description: The unique identifier of the invitation.
          schema:
            type: string
            example: 66cc313988befe60e3413e75
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  description: Channel through which the member is joining (optional).
                  example: friend referral
      responses:
        '200':
          description: >-
            Successful response indicating the member has joined the private
            club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateJoinResponse'
        '400':
          description: >-
            Bad request response indicating an issue with the request for
            joining a private club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateJoinBadRequestResponse'
        '404':
          description: >-
            Not found response indicating the requested private club invitation
            does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateJoinNotFoundResponse'
  /v1/clubs/{club_id}/invitations:
    post:
      summary: Create an invitation to a club
      description: Creates an invitation from one member to another in a specified club.
      parameters:
        - name: club_id
          in: path
          required: true
          description: >-
            The unique identifier of the club for which the invitation is being
            created.
          schema:
            type: string
            example: 33cc313988befe60e3413e76
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - inviter_customer_id
                - invitee_customer_id
              properties:
                inviter_customer_id:
                  type: string
                  description: The identifier of the member sending the invitation.
                  example: 33cc313988befe60e3413e76
                invitee_customer_id:
                  type: string
                  description: The identifier of the member receiving the invitation.
                  example: 22cc313988befe60e3413e75
      responses:
        '200':
          description: Invitation created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationSuccessResponse'
        '400':
          description: Bad request response indicating an issue with the invitation request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationBadRequestErrorResponse'
        '404':
          description: Not found response indicating the requested club does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationNotFoundErrorResponse'
  /v1/clubs/{club_id}/applicants/{customer_id}/accept:
    post:
      summary: Accept club membership
      description: >-
        This endpoint allows a user to accept an applicant into a club. The
        action must be performed by the owner of the club.
      parameters:
        - name: club_id
          in: path
          required: true
          description: >-
            Unique identifier of the club to which the applicant is being
            accepted.
          schema:
            type: string
        - name: customer_id
          in: path
          required: true
          description: >-
            Unique identifier of the customer who is being accepted as a member
            of the club.
          schema:
            type: string
      requestBody:
        required: true
        description: Information required to accept the applicant into the club.
        content:
          application/json:
            schema:
              type: object
              properties:
                actor:
                  type: string
                  description: >-
                    ID of the customer who is making the action. Must be the
                    owner of the club.
                  example: 33cc313988befe60e3413e76
                reason:
                  type: string
                  description: Reason for the acceptance (optional).
                  example: Reason
      responses:
        '200':
          description: Successful acceptance of club membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptSuccessResponse'
        '400':
          description: Bad request error responses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessBadRequestError'
        '404':
          description: Not found error responses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessNotFoundError'
  /v1/clubs/{club_id}/applicants/{customer_id}/ban:
    post:
      summary: Ban an applicant from a club
      description: This endpoint allows a user to ban an applicant from the club.
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: string
        - name: customer_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actor:
                  type: string
                  description: ID of the customer who is making the action.
                  example: 33cc313988befe60e3413e76
                reason:
                  type: string
                  description: Reason for the ban (optional).
                  example: Returning exploiter.
      responses:
        '200':
          description: Response for banning a club applicant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessBanResponse'
        '400':
          description: Bad Request error responses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BanBadRequestError'
        '404':
          description: Not Found error responses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BanNotFoundError'
  /v1/clubs/{club_id}/applicants/{customer_id}/refuse:
    post:
      summary: Refuse a club applicant
      description: This endpoint allows a user to refuse an applicant from the club.
      parameters:
        - name: club_id
          in: path
          required: true
          description: >-
            Unique identifier of the club from which the applicant is being
            refused.
          schema:
            type: string
        - name: customer_id
          in: path
          required: true
          description: >-
            Unique identifier of the customer who is being refused from the
            club.
          schema:
            type: string
      requestBody:
        required: true
        description: Information required to refuse the applicant from the club.
        content:
          application/json:
            schema:
              type: object
              properties:
                actor:
                  type: string
                  description: >-
                    ID of the customer who is making the action. Must be the
                    owner of the club.
                  example: 33cc313988befe60e3413e76
                reason:
                  type: string
                  description: Reason for refusing the applicant (optional).
                  example: Reason.
      responses:
        '200':
          description: Successful response for refusing an applicant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessRefuseResponse'
        '400':
          description: Bad Request error responses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefuseBadRequestError'
        '404':
          description: Not Found error responses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefuseNotFoundError'
  /v1/clubs/{club_id}/members/{customer_id}/ownership:
    post:
      summary: Assign club ownership
      description: >-
        This endpoint reassigns the club ownership to a specified member of the
        club.
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: string
            example: 66cc313988befe60e3413e75
          description: ID of the club to assign ownership.
        - name: customer_id
          in: path
          required: true
          schema:
            type: string
            example: 33cc313988befe60e3413e76
          description: ID of the new club owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actor:
                  type: string
                  description: ID of the current owner making the request.
                  example: 22cc313988befe60e3413e76
                reason:
                  type: string
                  description: Reason for changing ownership (optional).
                  example: Change ownership
              required:
                - actor
      responses:
        '200':
          description: Successful response for assigning club ownership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnershipSuccessResponse'
        '400':
          description: Bad Request error responses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerBadRequestResponses'
        '404':
          description: Not Found error responses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerNotFoundResponses'
  /v1/clubs/{club_id}/disband:
    post:
      summary: Disband a Club
      description: >-
        This endpoint allows users to disband a specified club. Only the current
        owner of the club can perform this action.
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: string
            example: 66cc313988befe60e3413e75
          description: The ID of the club to disband.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actor:
                  type: string
                  description: The ID of the current owner making the request.
                  example: 62cc313988befe60e3413e75
                reason:
                  type: string
                  description: The reason for disbanding the club (optional).
                  example: Not interested
              required:
                - actor
      responses:
        '200':
          description: Successful response when the club is disbanded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisbandSuccessResponse'
        '400':
          description: Bad Request error responses for disbanding a club.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisbandBadRequestResponses'
        '404':
          description: Not Found error responses for disbanding a club.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisbandNotFoundResponses'
  /v1/clubs/{clubId}/history:
    get:
      summary: Retrieve club history
      description: >-
        This endpoint provides the history of actions performed in a club with
        optional filtering.
      parameters:
        - name: clubId
          in: path
          required: true
          description: The ID of the club to retrieve history for.
          schema:
            type: string
            example: 66cc313988befe60e3413e75
        - name: type
          in: query
          required: false
          description: Filter history by action type.
          schema:
            type: string
            enum:
              - club_applicant_accept
              - club_applicant_refuse
              - club_create
              - club_disband
              - club_member_ban
              - club_member_unban
              - club_member_join
              - club_member_remove
              - club_ownership_assign
              - club_ownership_revoke
              - club_point_contribution
              - club_point_spent
              - club_point_add
              - club_point_remove
            example: club_create
        - name: customer_id
          in: query
          required: false
          description: Filter history by customer ID.
          schema:
            type: string
            example: 22cc313988befe60e3413e76
        - name: created_at
          in: query
          required: false
          description: Filter or order history by creation date.
          schema:
            type: string
            format: date-time
            example: '2024-01-01T00:00:00+01:00'
        - name: offset
          in: query
          required: false
          description: >-
            Offsets the starting number of actions to return. This is used in
            pagination in conjunction with the limit query.
          schema:
            type: integer
            example: 0
        - name: limit
          in: query
          required: false
          description: >-
            Limits the number of actions returned in one response. Other values
            are accessible by pagination made accessible via the offset.
          schema:
            type: integer
            example: 20
      responses:
        '200':
          description: >-
            Response containing the history of actions taken on the specified
            club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubHistoryResponse'
        '400':
          description: >-
            A response indicating that the request was invalid. This response
            may contain different errors, such as limit, offset, or query
            parameter errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubHistoryBadRequestErrorResponse'
        '404':
          description: A response indicating that the specified club could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubHistoryNotFoundErrorResponse'
  /v1/clubs/{club_id}/members/{customer_id}/point-alignment:
    post:
      summary: Adjust points for a specific club member
      description: >-
        This endpoint allows you to adjust the points for a specific member of a
        club. Points can be either positive or negative, and you may include a
        reason for the adjustment.
      parameters:
        - name: club_id
          in: path
          required: true
          description: The ID of the club where the member belongs.
          schema:
            type: string
        - name: customer_id
          in: path
          required: true
          description: The ID of the customer who is a member of the club.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                points:
                  type: integer
                  description: >-
                    The number of points to adjust, can be a positive or
                    negative whole number.
                  example: 100
                reason:
                  type: string
                  maxLength: 500
                  description: Optional reason for the adjustment.
                  example: Test
      responses:
        '200':
          description: >-
            A successful response containing the updated member and club
            information after the points adjustment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointAlignmentResponse'
        '400':
          description: A response indicating that the request parameters were invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointAlignmentBadRequestErrorResponse'
        '404':
          description: >-
            A response indicating that the specified club or member could not be
            found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointAlignmentNotFoundErrorResponse'
